[build-system]
requires = [
    "setuptools==80.9.0",
    "wheel==0.45.1",
    "Cython==3.1.6",
    "numpy==2.4.6",
]
build-backend = "setuptools.build_meta"

[project]
name = "ditherzam"
version = "0.3.0a1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
release = ["onnxruntime==1.22.1", "pyinstaller>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["ditherzam*"]

[project.scripts]
ditherzam = "ditherzam.app:main"
